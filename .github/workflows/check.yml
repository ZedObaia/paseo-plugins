name: check
on: [push, pull_request]
jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin:
          [resources, devices, projects-everywhere, ports, auto-fetch, linear, databases, toolbox, status-sidebar, bots]
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/package.json
      - run: npm ci --ignore-scripts
      - run: npm run prepare:studio
        if: matrix.plugin == 'databases'
      - run: npm run licenses:check && npm run audit:dependencies
        if: matrix.plugin == 'databases'
      - run: npm run typecheck
      - run: npm test
  databases-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: paseo_test
          POSTGRES_PASSWORD: paseo_test_password
          POSTGRES_DB: paseo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paseo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: plugins/databases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/databases/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run prepare:studio
      - run: npm run test:integration
        env:
          PASEO_DATABASE_TEST_URL: postgresql://paseo_test:paseo_test_password@127.0.0.1:5432/paseo_test
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes prettier@3.6.2 --check .
